spring:
  application:
    name: app-mqtt-server

mqtt:
  server:
    enabled: true
    bind-address: 0.0.0.0
    port: 1883
    max-packet-size: 1048576
    max-client-id-length: 65535
    limits:
      client-ids: 100000
      subscriptions-per-session: 1024
      inflight-messages-per-session: 1024
      offline-messages-per-session: 10000
      offline-queue-bytes-per-session: 67108864
      retained-messages: 100000
      retained-message-bytes: 268435456
    authentication:
      type: anonymous
    authorization:
      type: allow-all
    persistence:
      session:
        type: sqlite
        sqlite:
          database-path: data/mqtt-session.db
      retained-message:
        type: sqlite
        sqlite:
          database-path: data/mqtt-retained.db
