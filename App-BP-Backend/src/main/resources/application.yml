server:
  port: 8888
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,application/xhtml+xml,text/html,text/xml,text/plain
    min-response-size: 1024
  servlet:
    session:
      timeout: 1800
spring:
  application:
    name: businessProcess-backend
  threads:
    virtual:
      enabled: true
  # 允许循环依赖
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  web:
    resources:
      chain:
        cache: false
  profiles:
    active: dev
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
    #mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://www.baicd.fun:13306/bcd?characterEncoding=utf8&useSSL=false&rewriteBatchedStatements=true&serverTimezone=GMT%2B8&generateSimpleParameterMetadata=true&allowPublicKeyRetrieval=True
    username: root
    password: 123456
    #pgsql:
  #    driver-class-name: org.postgresql.Driver
  #    url: jdbc:postgresql://127.0.0.1:5432/msbf
  #    username: root
  #    password: 123456

  #  jdbcTemplate配置
  jdbc:
    template:
      fetch-size: 1000
      max-rows: -1
      query-timeout:
  #mongodb配置
#  mongodb.uri: mongodb://root:root@127.0.0.1:27017/bcd
    #redis配置
    #如果都进行了配置,加载的先后顺序为:
    #sentinel>cluster>single
  data:
    redis:
      ssl:
        enabled: true
      repositories:
        enabled: false
      #公用配置
      database: 0
      timeout: 60000
      password: 123456
      #异步lettuce连接池(默认)
      lettuce:
        pool:
          maxIdle: 8
          minIdle: 0
          maxActive: 8
          maxWait: -1
          enabled: true
        shutdown-timeout: 100ms
      #主从配置
      #     sentinel:
      #       master: myMaster
      #       nodes: 127.0.0.1:23679,127.0.0.1:23680,127.0.0.1:23681
      #集群配置
      #      cluster:
      #        maxRedirects: 3
      #        nodes:
      #          - 192.168.23.129:7001
      #          - 192.168.23.129:7002
      #          - 192.168.23.129:7003
      #          - 192.168.23.129:7004
      #          - 192.168.23.129:7005
      #          - 192.168.23.129:7006

      #单机配置
      host: www.baicd.fun
      port: 16379
  # kafka配置
  kafka:
    consumer:
      #      bootstrap-servers: kafka-test-1:9092,kafka-test-2:9093,kafka-test-3:9094
      #      bootstrap-servers: kafka-dev-1:9092,kafka-dev-2:9093,kafka-dev-3:9094
      bootstrap-servers: 127.0.0.1:19092
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
#      properties:
#        security.protocol: SASL_PLAINTEXT
#        sasl:
#          mechanism: PLAIN
#          jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="srih_rvm30_sy" password="!QAZ2wsx";'
    producer:
      #      bootstrap-servers: kafka-test-1:9092,kafka-test-2:9093,kafka-test-3:9094
      #      bootstrap-servers: kafka-dev-1:9092,kafka-dev-2:9093,kafka-dev-3:9094
      bootstrap-servers: 127.0.0.1:19092
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    listener:
      # topic不存在时候是否正常启动
      missing-topics-fatal: false
  mail:
    host: smtp.qq.com
    username:
    password:
    default-encoding: UTF-8

