# 统一鉴权中间件。
# 仅挂载到 /{微服务模块名}/api/** 路由，公开的 Auth 路由不使用该中间件。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bp-forward-auth
spec:
  forwardAuth:
    # App-BP-Auth 的集群内地址，/verify 不需要暴露给外部客户端。
    address: http://app-bp-auth:8890/api/verify
    # 不信任客户端传入的 X-Forwarded-*，由 Traefik 生成原始请求信息。
    trustForwardHeader: false
    # 转发认证所需的 Token。Sa-Token 默认使用 token Cookie 或 token Header。
    authRequestHeaders:
      - Cookie
      - token
      - Authorization
    # 鉴权成功后，把 Auth 服务生成的用户 JSON 注入业务请求。
    authResponseHeaders:
      - X-User
---
# 移除路径开头的微服务模块名。
# 例如：/backend/api/user -> /api/user，/backend/swagger-ui.html -> /swagger-ui.html。
# StripPrefixRegex 会写入 X-Forwarded-Prefix，供 Springdoc 生成正确的外部资源地址。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bp-module-prefix-strip
spec:
  stripPrefixRegex:
    regex:
      - ^/[^/]+
---
# 公开接口路由，不执行身份和权限校验。
# Auth 模块的接口和静态资源统一通过 /auth/** 转发。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bp-public
spec:
  entryPoints:
    - web
  routes:
    # /auth/** 转发到 App-BP-Auth，并移除微服务模块名 auth。
    - match: Path(`/auth`) || PathPrefix(`/auth/`)
      kind: Rule
      middlewares:
        - name: bp-module-prefix-strip
      services:
        - name: app-bp-auth
          port: 9999
---
# Backend 模块路由。
# 每增加一个微服务，在 routes 下复制 API 和静态资源两条规则，并修改模块名、Service 名称和端口。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bp-api
spec:
  entryPoints:
    - web
  routes:
    # Backend API：鉴权后移除模块名，再转发到 /api/**。
    - match: Path(`/backend/api`) || PathPrefix(`/backend/api/`)
      kind: Rule
      priority: 100
      middlewares:
        # 顺序不能颠倒：先使用外部原始路径鉴权，再移除模块名。
        - name: bp-forward-auth
        - name: bp-module-prefix-strip
      services:
        - name: app-bp-backend
          port: 8888
    # Backend 静态资源：移除模块名后直接转发，不执行接口鉴权。
    - match: Path(`/backend`) || PathPrefix(`/backend/`)
      kind: Rule
      priority: 10
      middlewares:
        - name: bp-module-prefix-strip
      services:
        - name: app-bp-backend
          port: 8888
